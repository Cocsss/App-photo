/* Uniformiser les bords à l'intérieur d'un même modèle. Un cadre nettement plus
   arrondi (ou plus bordé) que ses voisins est presque toujours une coquille de
   saisie, pas une intention : on aligne sur la valeur majoritaire. */
(function unifySlotEdges(){
  const mode = vals => {
    const c = new Map();
    vals.forEach(v => c.set(v, (c.get(v) || 0) + 1));
    let best = vals[0], n = 0;
    c.forEach((count, value) => { if (count > n){ n = count; best = value; } });
    return {value:best, count:n};
  };
  TPL.forEach(t => {
    if (!t.slots || t.slots.length < 3) return;
    ['radius', 'border', 'shadow'].forEach(key => {
      const vals = t.slots.map(s => s[key] || 0);
      const m = mode(vals);
      if (m.count > vals.length/2)
        t.slots.forEach(s => { if ((s[key] || 0) !== m.value) s[key] = m.value; });
    });
  });
})();

function h(tag, props = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)){
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c == null || c === false) return; e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}

/* Une photo d'iPhone fait 4032 px de large. Gardée en mémoire à 2400 px, c'est
   ~30 Mo par image. 1600 px suffit largement pour un export en 1080. */
function toCanvasImg(src, nw, nh){
  const r = Math.min(1, 1600/Math.max(nw, nh));
  const [c, x] = offscreen(nw*r, nh*r);
  x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
function readDataURL(file){
  return new Promise((res, rej) => { const fr = new FileReader();
    fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
}
function viaImage(src){
  return new Promise((res, rej) => { const im = new Image();
    im.onload = () => { try { res(toCanvasImg(im, im.naturalWidth, im.naturalHeight)); } catch(e){ rej(e); } };
    im.onerror = () => rej(new Error('image')); im.src = src; });
}
async function loadImage(file){

    try { const bm = await createImageBitmap(file, {imageOrientation:'from-image'}); c = toCanvasImg(bm, bm.width, bm.height); bm.close && bm.close(); } catch(e){}
    if (!c) try { const bm = await createImageBitmap(file); c = toCanvasImg(bm, bm.width, bm.height); bm.close && bm.close(); } catch(e){}
  }
  if (!c) try { c = await viaImage(await readDataURL(file)); } catch(e){}
  if (!c) try { const u = URL.createObjectURL(file); c = await viaImage(u); URL.revokeObjectURL(u); } catch(e){}
  return c ? {kind:'image', el:c, w:c.width, h:c.height} : null;
}
function loadVideo(file){
  return new Promise(res => {
    const v = document.createElement('video');
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.loop = true; v.preload = 'auto';
    v.controls = false;
    v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.setAttribute('webkit-playsinline', '');
    v.setAttribute('disablepictureinpicture', ''); v.setAttribute('disableremoteplayback', '');
    v.setAttribute('x-webkit-airplay', 'deny');
    /* iOS passe parfois la vidéo en plein écran malgré playsinline (surtout quand
       le son est activé). Ces vidéos-là ne sont qu'une source de pixels pour le
       canvas : si iOS les ouvre, on referme aussitôt. */
    const noFull = () => { try { if (v.webkitExitFullscreen) v.webkitExitFullscreen();
      else if (document.exitFullscreen && document.fullscreenElement === v) document.exitFullscreen(); } catch(e){} };
    v.addEventListener('webkitbeginfullscreen', noFull);
    v.addEventListener('fullscreenchange', noFull);
    v.addEventListener('webkitfullscreenchange', noFull);
    $('vids').appendChild(v);
    let done = false, triedData = false;
    const finish = m => { if (done) return; done = true; if (!m) v.remove(); res(m); };
    v.addEventListener('loadeddata', () => {
      v.play().catch(() => {});
      finish({kind:'video', el:v, w:v.videoWidth || 1080, h:v.videoHeight || 1920, dur:v.duration});
    });
    v.addEventListener('error', () => {
      if (done) return;
      if (triedData) return finish(null);
      triedData = true;
      readDataURL(file).then(u => { v.src = u; v.load(); v.play().catch(() => {}); }).catch(() => finish(null));
    });
    setTimeout(() => finish(null), 25000);
    try { v.src = URL.createObjectURL(file); } catch(e){ v.dispatchEvent(new Event('error')); }
    v.load(); v.play().catch(() => {});
  });
}
function isVideoFile(f){ return (f.type || '').startsWith('video') || /\.(mov|mp4|m4v|webm|3gp|hevc|avi|mkv)$/i.test(f.name || ''); }
function isHeic(f){ return /heic|heif/i.test(f.type || '') || /\.(heic|heif)$/i.test(f.name || ''); }
/* Un canvas hors écran prêt à dessiner, en une ligne. */
function offscreen(w, hh, opts){
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(hh));
  const x = c.getContext('2d', opts);
  x.imageSmoothingQuality = 'high';
  return [c, x];
}
function makeThumb(m){
  const [c, x] = offscreen(160, 160), s = Math.max(160/m.w, 160/m.h);
  x.fillStyle = '#c9d3d1'; x.fillRect(0, 0, 160, 160);
  try { x.drawImage(m.el, (160 - m.w*s)/2, (160 - m.h*s)/2, m.w*s, m.h*s); } catch(e){}
  return c;
}
async function ingest(files){
  const out = [];
  let done = 0, failReason = '';
  const anyVid = files.some(isVideoFile);
  showLoad(files.length > 1 ? `Import de ${files.length} fichiers` : (anyVid ? 'Import de la vidéo' : 'Import de la photo'),
    anyVid ? 'Les vidéos mettent quelques secondes à s’ouvrir.' : '');
  await nextFrame();
  for (const f of files){
    $('loadSub').textContent = files.length > 1 ? `${done + 1} sur ${files.length}` : (isVideoFile(f) ? 'Lecture de la vidéo…' : 'Préparation…');
    await nextFrame();
    const m = isVideoFile(f) ? await loadVideo(f) : await loadImage(f);
    done++;
    /* Une vidéo refusée : on lit ses en-têtes pour dire précisément pourquoi
       plutôt que de la laisser disparaître sans un mot. */
    if (!m){ if (isVideoFile(f)) failReason = await explainVideo(f); continue; }
    m.id = ++mid; m.thumb = makeThumb(m);
    if (m.kind === 'video'){ m.file = f; if (S.audio.id == null) S.audio.id = m.id; }
    rememberMedia(m, f);
    if (m.kind === 'video') m.el.addEventListener('timeupdate', () => {
      m.thumb = makeThumb(m);
      if (S.sel < 0 && (S.tab === 'media' || S.tab === 'bg')) buildSheet();
    }, {once:true});
    S.lib.push(m); out.push(m);
  }
  hideLoad();
  if (!out.length){
    const heic = files.some(isHeic);
    toast(failReason ? failReason : (heic
      ? "Ce format HEIC n’est pas lisible par ce navigateur. Ouvre l’app dans Safari, ou règle Réglages › Appareil photo › Formats sur « Le plus compatible »."
      : "Impossible d'ouvrir ce fichier. Essaie une photo JPEG ou une vidéo MP4/MOV."), 8000);
  }
  else if (out.length < files.length) toast(failReason || `${files.length - out.length} fichier(s) n'ont pas pu être ouverts.`, 7000);
  else hideToast();
  return out;
}

function drawFolder(c, it, W2, H2){

  c.quadraticCurveTo(-W2/2, -H2/2, -W2/2 + r, -H2/2);
  c.lineTo(-W2/2 + W2*.34, -H2/2);
  c.lineTo(-W2/2 + W2*.42, -H2/2 + H2*.13);

function demoPhoto(i){

  }

    x.globalAlpha = 1;
  } else if (S1.kind === 'city'){

    for (let bx = 0; bx < W2; bx += 22){

      x.fillStyle = 'rgba(255,225,160,.75)';

    x.lineTo(W2, H2); x.closePath(); x.fill();

const COVER_KEY = 'montageCover:';
function loadCover(name){ try { return localStorage.getItem(COVER_KEY + name); } catch(e){ return null; } }
function saveCover(name, data){ try { localStorage.setItem(COVER_KEY + name, data); return true; } catch(e){ return false; } }
function clearCovers(){
  try { Object.keys(localStorage).filter(k => k.indexOf(COVER_KEY) === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
  homeBuilt = false; buildHome(true);
}
function coverFromCanvas(){
  const tw = 240, [c, x] = offscreen(tw, Math.round(tw*S.H/S.W));
  x.drawImage(cv, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .72);
}
function setCover(){
  const name = TPL[S.tpl] && TPL[S.tpl].name;
  if (!name) return;
  const prev = exporting; exporting = true; render(); exporting = prev;
  const data = coverFromCanvas(); draw();
  homeBuilt = false;
  if (saveCover(name, data)) toast('Couverture enregistrée pour « ' + name + ' »', 2200);
  else toast('Impossible d’enregistrer la couverture ici.', 3000);
}
async function setCoverFromFile(file){
  const m = await loadImage(file);
  if (!m){ toast('Impossible d’ouvrir cette image.', 3000); return; }
  const name = TPL[S.tpl] && TPL[S.tpl].name; if (!name) return;
  const [W2, H2] = FORMATS[TPL[S.tpl].fmt || '9:16'];
  const tw = 240, th = Math.round(tw*H2/W2);
  const [c, x] = offscreen(tw, th);
  const sc = Math.max(tw/m.w, th/m.h);
  x.drawImage(m.el, (tw - m.w*sc)/2, (th - m.h*sc)/2, m.w*sc, m.h*sc);
  homeBuilt = false;
  if (saveCover(name, c.toDataURL('image/jpeg', .72))) toast('Couverture choisie pour « ' + name + ' »', 2200);
  else toast('Impossible d’enregistrer la couverture ici.', 3000);

/* ================= Annuler / Refaire ================= */
const HIST = {past:[], future:[], t:0};
function snapshot(){
  return JSON.stringify({
    fmt:S.fmt, split:S.split, vsplit:S.vsplit, ratio:S.ratio, film:S.film,
    bg:Object.assign({}, S.bg, {media:S.bg.media ? S.bg.media.id : null}),
    bg2:Object.assign({}, S.bg2, {media:S.bg2.media ? S.bg2.media.id : null}),
    items:S.items.map(i => Object.assign({}, i, {media:i.media ? i.media.id : null,
      pts:i.pts ? i.pts.map(q => ({x:q.x, y:q.y})) : undefined, corners:i.corners ? [...i.corners] : undefined}))
  });
}
function restore(str){
  const o = JSON.parse(str), byId = id => S.lib.find(m => m.id === id) || null;
  S.fmt = o.fmt; S.split = o.split; S.vsplit = !!o.vsplit; S.ratio = o.ratio; Object.assign(S.film, o.film);
  const [W, H] = FORMATS[S.fmt]; S.W = W; S.H = H;
  makeGrain(); makeTorn(); layout();
  Object.assign(S.bg, o.bg, {media:byId(o.bg.media)});
  Object.assign(S.bg2, o.bg2, {media:byId(o.bg2.media)});
  S.items = o.items.map(i => Object.assign({}, i, {media:byId(i.media)}));
  S.sel = -1; S.crop = false; S.drawPath = false;
  bgDirty = true; refresh(); updateUndo();
}
function mark(){
  const cur = snapshot();
  saveSoon();
  if (HIST.past[HIST.past.length - 1] === cur) return;
  HIST.past.push(cur); if (HIST.past.length > 40) HIST.past.shift();
  HIST.future.length = 0; updateUndo();
}
function markSoon(){ clearTimeout(HIST.t); HIST.t = setTimeout(mark, 450); }
function undo(){
  if (HIST.past.length < 2){ toast('Rien à annuler.', 1500); return; }
  HIST.future.push(HIST.past.pop()); restore(HIST.past[HIST.past.length - 1]);
}
function redo(){
  if (!HIST.future.length){ toast('Rien à refaire.', 1500); return; }
  const n = HIST.future.pop(); HIST.past.push(n); restore(n);
}
function updateUndo(){
  $('btnUndo').disabled = HIST.past.length < 2;
  $('btnRedo').disabled = !HIST.future.length;
}

/* Lecture des en-têtes d'un MP4 pour expliquer pourquoi une vidéo ne s'ouvre
   pas. On ne lit que les quelques kilo-octets utiles, jamais le fichier entier. */
async function probeMp4(file){
  const CHROMA = ['monochrome', '4:2:0', '4:2:2', '4:4:4'];
  const buf = async (off, len) => new Uint8Array(await file.slice(off, off + len).arrayBuffer());
  const u32 = (b, i) => (b[i] << 24 | b[i+1] << 16 | b[i+2] << 8 | b[i+3]) >>> 0;
  const str = (b, i) => String.fromCharCode(b[i], b[i+1], b[i+2], b[i+3]);
  try {
    /* 1. Trouver moov parmi les boîtes de premier niveau. */
    let off = 0, moov = null;
    for (let guard = 0; guard < 64 && off < file.size; guard++){
      const head = await buf(off, 16);
      if (head.length < 8) break;
      let size = u32(head, 0);
      const type = str(head, 4);
      if (size === 1) size = Number(new DataView(head.buffer).getBigUint64(8));
      if (!size || size < 8) break;
      if (type === 'moov'){ moov = await buf(off, Math.min(size, 6e6)); break; }
      off += size;
    }
    if (!moov) return null;

    /* 2. Descendre jusqu'à stsd, puis lire le format de l'échantillon. */
    const find = (b, type, from, to) => {
      let i = from;
      while (i + 8 <= to){
        const size = u32(b, i);
        if (size < 8) return null;
        if (str(b, i + 4) === type) return [i + 8, i + size];
        i += size;
      }
      return null;
    };
    let range = [8, moov.length];
    for (const step of ['trak', 'mdia', 'minf', 'stbl', 'stsd']){
      range = find(moov, step, range[0], range[1]);
      if (!range) return null;
    }
    const entry = range[0] + 8;                 /* stsd : version/flags + nombre */
    const codec = str(moov, entry + 4);
    const out = {codec};
    /* Après l'en-tête de boîte (8) viennent 78 octets de champs vidéo, puis les
       boîtes de configuration. */
    const entryEnd = entry + u32(moov, entry);
    const cfg = find(moov, codec === 'avc1' || codec === 'avc3' ? 'avcC' : 'hvcC',
      entry + 8 + 78, Math.min(entryEnd, range[1]));
    if (cfg && (codec === 'hvc1' || codec === 'hev1')){
      out.chroma = CHROMA[moov[cfg[0] + 16] & 3];
      out.bits = (moov[cfg[0] + 17] & 7) + 8;
    }
    return out;
  } catch(e){ return null; }
}

/* Message clair quand une vidéo refuse de s'ouvrir. */
async function explainVideo(file){
  const p = await probeMp4(file);
  if (!p) return 'Cette vidéo n’a pas pu être ouverte. Essaie de l’exporter depuis Photos avant de l’importer.';
  if ((p.codec === 'hvc1' || p.codec === 'hev1') && p.chroma && p.chroma !== '4:2:0')
    return `Vidéo en HEVC ${p.chroma} ${p.bits} bits : Safari ne sait lire que le 4:2:0. ` +
      'Règle ton appareil en 4:2:0, ou passe le fichier par Photos qui le convertira.';
  if (p.codec === 'hvc1' || p.codec === 'hev1')
    return `Vidéo en HEVC ${p.bits || 8} bits non lue par ce navigateur. Essaie via Photos.`;
  return `Format vidéo « ${p.codec} » non pris en charge par ce navigateur.`;
}

/* ================= Recadrage du temps ================= */
const TRIM = {m:null, item:null, drag:null, vid:null};
function fmtT(t){ return t.toFixed(1).replace('.', ',') + ' s'; }
/* La bande d'images. Avant, chaque vignette faisait la largeur du format de la
   vidéo : sur du 16:9 la bande était quatre fois trop large, et le CSS
   l'écrasait. Maintenant on taille la bande à la place disponible, avec des
   vignettes carrées recadrées au centre. */
async function buildStrip(m, pxW, pxH){
  if (m.strip && m.stripW === pxW) return m.strip;
  const v = m.el, dur = isFinite(v.duration) ? v.duration : 0;
  const N = clamp(Math.round(pxW/pxH), 4, 14);
  const cw = Math.round(pxW/N);
  const [c, x] = offscreen(cw*N, pxH);
  const sc = Math.max(cw/m.w, pxH/m.h), dw = m.w*sc, dh = m.h*sc;
  const was = v.currentTime, playing = !v.paused;
  v.pause();
  for (let i = 0; i < N; i++){
    const t = dur*(i + .5)/N;
    await new Promise(r => { const to = setTimeout(r, 900);
      v.addEventListener('seeked', () => { clearTimeout(to); r(); }, {once:true});
      try { v.currentTime = t; } catch(e){ r(); } });
    try {
      x.save();
      x.beginPath(); x.rect(i*cw, 0, cw, pxH); x.clip();
      x.drawImage(v, i*cw + (cw - dw)/2, (pxH - dh)/2, dw, dh);
      x.restore();
    } catch(e){}
  }
  try { v.currentTime = was; } catch(e){}
  if (playing) v.play().catch(() => {});
  m.strip = c; m.stripW = pxW;
  return c;
}
function openTrim(it){

}
function buildTrimUI(){
  const m = TRIM.m, dur = isFinite(m.el.duration) ? m.el.duration : 0;
  const D = Math.min(videoDuration(), dur || 1);
  const top = $('trimTop'); top.innerHTML = '';
  const prev = h('video', {playsinline:true, muted:true, loop:true, autoplay:true});
  prev.muted = true; prev.src = m.el.currentSrc || m.el.src;
  prev.currentTime = m.start || 0;
  TRIM.vid = prev; top.appendChild(prev);
  const P = $('trimPanel'); P.innerHTML = '';
  const box = h('div', {class:'stripBox'});
  const cv2 = h('canvas', {width:960, height:152});
  const win = h('div', {class:'win'}, h('i', {class:'l'}), h('i', {class:'r'}));
  const head = h('div', {class:'head'});
  box.appendChild(cv2); box.appendChild(win); box.appendChild(head);
  const play = h('button', {class:'play', 'aria-label':'Lecture'}, '▶');
  play.onclick = () => { if (prev.paused){ prev.play().catch(() => {}); play.textContent = '❚❚'; } else { prev.pause(); play.textContent = '▶'; } };
  const strip = h('div', {class:'strip'}, play, box);
  const info = h('div', {class:'trimRow'}, h('span', {}, ''), h('span', {}, ''));
  const restart = () => {
    const st = m.start || 0;
    try { prev.currentTime = st; } catch(e){}
    prev.play().catch(() => {}); play.textContent = '❚❚';
    try { m.el.currentTime = st; } catch(e){}
  };
  const endOf = () => (m.end && m.end > 0 ? Math.min(m.end, dur) : dur);
  const sync = () => {
    const st = m.start || 0, en = endOf();
    const left = dur ? st/dur*100 : 0, wpc = dur ? (en - st)/dur*100 : 100;
    win.style.left = left + '%'; win.style.width = wpc + '%';
    info.firstChild.textContent = fmtT(st) + ' → ' + fmtT(en);
    info.lastChild.textContent = fmtT(en - st) + ' gardées sur ' + fmtT(dur);
  };
  const moveHead = () => {
    if (!dur) return;
    head.style.left = clamp(prev.currentTime/dur, 0, 1)*100 + '%';
  };
  prev.addEventListener('timeupdate', () => {
    const st = m.start || 0;
    if (prev.currentTime > st + D || prev.currentTime < st - .05){ try { prev.currentTime = st; } catch(e){} }
    moveHead();
  });
  let headRAF;
  const tick = () => { moveHead(); headRAF = requestAnimationFrame(tick); };
  tick();
  TRIM.stopHead = () => cancelAnimationFrame(headRAF);
  const MIN = .3;
  const timeAt = clientX => {
    const r = box.getBoundingClientRect();
    return clamp((clientX - r.left)/r.width, 0, 1)*dur;
  };
  /* Trois gestes : tirer le bord gauche, tirer le bord droit, ou déplacer la
     fenêtre entière. C'est la convention de tous les outils de découpe. */
  const apply = (mode, clientX, off) => {
    const t = timeAt(clientX), st = m.start || 0, en = endOf();
    if (mode === 'L') m.start = clamp(t, 0, en - MIN);
    else if (mode === 'R') m.end = clamp(t, st + MIN, dur);
    else {
      const len = en - st;
      m.start = clamp(t - off, 0, Math.max(0, dur - len));
      m.end = m.start + len;
    }
    sync(); restart(); draw();
  };
  box.addEventListener('pointerdown', e => {
    box.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect();
    const st = m.start || 0, en = endOf();
    const xl = st/dur*r.width, xr = en/dur*r.width, px = e.clientX - r.left;
    const grab = 26;                       /* zone de préhension, au doigt */
    let mode = 'M', off = px - xl;
    if (Math.abs(px - xl) < grab) mode = 'L';
    else if (Math.abs(px - xr) < grab) mode = 'R';
    else if (px < xl || px > xr){ mode = 'M'; off = (en - st)/dur*r.width/2; }
    TRIM.drag = {mode, off:off/r.width*dur};
    apply(mode, e.clientX, TRIM.drag.off);
  });
  box.addEventListener('pointermove', e => {
    if (!e.buttons || !TRIM.drag) return;
    apply(TRIM.drag.mode, e.clientX, TRIM.drag.off);
  });
  ['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, () => TRIM.drag = null));
  const nudge = d => {
    const len = endOf() - (m.start || 0);
    m.start = clamp((m.start || 0) + d, 0, Math.max(0, dur - len));
    m.end = m.start + len;
    sync(); restart(); draw();
  };
  /* La bande reste visible en permanence ; en dessous, les réglages changent
     selon l'onglet. C'est la disposition de tous les outils de montage. */
  const tools = h('div', {});
  const paintTools = () => {
    tools.innerHTML = '';
    if (TRIM.tab === 'Vitesse'){
      tools.appendChild(section(null,
        chips(['0,25×', '0,5×', '1×', '2×', '4×'],
          k => Math.abs((S.video.speed || 1) - SPEEDS[k]) < .001,
          k => { S.video.speed = SPEEDS[k];
            S.lib.forEach(x => { if (x.kind === 'video'){ try { x.el.playbackRate = SPEEDS[k]; } catch(e){} } });
            try { prev.playbackRate = SPEEDS[k]; } catch(e){}
            paintTools(); sync(); draw(); }),
        h('p', {class:'hint'}, 'Ralenti ou accéléré. La durée finale suit : à 2×, deux fois plus court.')));
    } else if (TRIM.tab === 'Couleur'){
      tools.appendChild(section(null,
        h('div', {class:'row'},
          filePick(LUT.data ? 'Changer de LUT' : 'Charger une LUT .cube',
            {accept:'.cube,.CUBE,text/plain'},
            async fs => { if (await loadCube(fs[0])){ bgDirty = true; paintTools(); draw(); } }),
          LUT.data ? btn('Retirer', () => { LUT.data = null; LUT.name = ''; paintTools(); draw(); }, 'btn danger') : null),
        LUT.data ? slider('Intensité', 0, 1, .01, () => LUT.amount, v => { LUT.amount = v; draw(); }, pct) : null,
        LUT.data ? compareBtn() : null,
        h('p', {class:'hint'}, LUT.data ? 'LUT active : ' + LUT.name

/* ================= LUT =================
   Une LUT .cube est une table de correspondance de couleurs : pour chaque
   couleur d'entrée, la couleur de sortie voulue. C'est ce que vendent les
   coloristes. On la déplie en texture et on l'applique sur le GPU — le canvas
   2D ne sait pas faire ça à une vitesse utilisable. */
const LUT = {data:null, size:0, name:'', amount:1, bypass:false};

/* Lecture d'un .cube : quelques en-têtes, puis size³ triplets RGB. */
function parseCube(txt){
  let size = 0, vals = null, k = 0;
  /* 6 Mo de texte, 275 000 lignes : on évite les expressions régulières ligne
     par ligne et on écrit dans un tableau typé alloué une seule fois. */
  let i = 0;
  const n = txt.length;
  while (i < n){
    let j = txt.indexOf('\n', i);
    if (j < 0) j = n;
    let a = i, b = j;
    while (a < b && txt.charCodeAt(a) <= 32) a++;
    while (b > a && txt.charCodeAt(b - 1) <= 32) b--;
    i = j + 1;
    if (a >= b) continue;
    const c0 = txt.charCodeAt(a);
    const numeric = (c0 >= 48 && c0 <= 57) || c0 === 45 || c0 === 46;
    if (!numeric){
      if (txt.charCodeAt(a) === 76 && txt.substr(a, 11) === 'LUT_3D_SIZE'){
        size = parseInt(txt.slice(a + 11, b), 10);
        if (size > 0 && size <= 128) vals = new Float32Array(size*size*size*3);
      }
      continue;
    }
    if (!vals) continue;
    const parts = txt.slice(a, b).split(/\s+/);
    if (parts.length < 3 || k + 3 > vals.length) continue;
    vals[k++] = +parts[0]; vals[k++] = +parts[1]; vals[k++] = +parts[2];
  }
  if (!size || !vals || k < vals.length) return null;

  /* Les LUT de Resolve sont souvent en 65 points : la texture ferait plus de
     4000 px de large, au-delà de ce qu'acceptent certains iPhone. On redescend
     à 33, le standard du métier, sans perte visible. */
  if (size > 33){
    const t = 33, out = new Float32Array(t*t*t*3), m = size - 1, mt = t - 1;
    for (let b2 = 0; b2 < t; b2++){
      const sb = Math.round(b2/mt*m);
      for (let g = 0; g < t; g++){
        const sg = Math.round(g/mt*m);
        for (let r = 0; r < t; r++){
          const src = ((sb*size + sg)*size + Math.round(r/mt*m))*3;
          const dst = ((b2*t + g)*t + r)*3;
          out[dst] = vals[src]; out[dst + 1] = vals[src + 1]; out[dst + 2] = vals[src + 2];
        }
      }
    }
    vals = out; size = t;
  }

  /* Texture 2D : les `size` tranches de bleu posées côte à côte. */
  const data = new Uint8Array(size*size*size*4);
  for (let b2 = 0; b2 < size; b2++)
    for (let g = 0; g < size; g++)
      for (let r = 0; r < size; r++){
        const src = ((b2*size + g)*size + r)*3;
        const dst = ((g*(size*size)) + (b2*size + r))*4;
        data[dst]     = Math.max(0, Math.min(255, Math.round(vals[src]*255)));
        data[dst + 1] = Math.max(0, Math.min(255, Math.round(vals[src + 1]*255)));
        data[dst + 2] = Math.max(0, Math.min(255, Math.round(vals[src + 2]*255)));
        data[dst + 3] = 255;
      }
  return {data, size};
}

const GL_VERT = `attribute vec2 p;varying vec2 uv;
void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const GL_FRAG = `precision highp float;
varying vec2 uv;uniform sampler2D img;uniform sampler2D lut;uniform float n;uniform float amt;
vec3 look(vec3 c){
  float m=n-1.;
  float bf=clamp(c.b,0.,1.)*m;
  float b0=floor(bf), b1=min(b0+1.,m), f=bf-b0;
  float x=clamp(c.r,0.,1.)*m+.5, y=(clamp(c.g,0.,1.)*m+.5)/n;
  vec3 s0=texture2D(lut,vec2((b0*n+x)/(n*n),y)).rgb;
  vec3 s1=texture2D(lut,vec2((b1*n+x)/(n*n),y)).rgb;
  return mix(s0,s1,f);
}
void main(){vec4 c=texture2D(img,uv);gl_FragColor=vec4(mix(c.rgb,look(c.rgb),amt),c.a);}`;

let GLX = null;
function lutGL(){
  if (GLX !== null) return GLX;
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl', {premultipliedAlpha:false, preserveDrawingBuffer:true});
    if (!gl) return (GLX = false);
    const mk = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, mk(gl.VERTEX_SHADER, GL_VERT));
    gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, GL_FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return (GLX = false);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const texImg = gl.createTexture(), texLut = gl.createTexture();
    [texImg, texLut].forEach((t, i) => {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    });
    gl.uniform1i(gl.getUniformLocation(prog, 'img'), 0);
    gl.uniform1i(gl.getUniformLocation(prog, 'lut'), 1);
    GLX = {c, gl, prog, texImg, texLut, loaded:null, sized:false,
      uN:gl.getUniformLocation(prog, 'n'), uA:gl.getUniformLocation(prog, 'amt')};
    return GLX;
  } catch(e){ return (GLX = false); }
}

/* Applique la LUT sur le canvas d'aperçu, en place. */
function lutPass(target, tctx){
  if (!LUT.data || LUT.bypass || LUT.amount <= .001) return;
  const X = lutGL();
  if (!X) return;
  const {gl} = X;
  const resized = X.c.width !== target.width || X.c.height !== target.height;
  if (resized){ X.c.width = target.width; X.c.height = target.height; X.sized = false; }
  gl.viewport(0, 0, X.c.width, X.c.height);
  if (X.loaded !== LUT.data){
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, X.texLut);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, LUT.size*LUT.size, LUT.size, 0, gl.RGBA, gl.UNSIGNED_BYTE, LUT.data);
    X.loaded = LUT.data;
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, X.texImg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  /* Réallouer la texture à chaque image coûte cher, surtout en 4K. Une fois la
     taille posée, on ne fait plus que réécrire son contenu. */
  if (!X.sized){
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, target);
    X.sized = true;
  } else {
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, gl.RGBA, gl.UNSIGNED_BYTE, target);
  }
  gl.uniform1f(X.uN, LUT.size);
  gl.uniform1f(X.uA, LUT.amount);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  tctx.save();
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.globalAlpha = 1; tctx.globalCompositeOperation = 'copy';
  tctx.drawImage(X.c, 0, 0);
  tctx.restore();
}

async function loadCube(file){
  /* Une LUT de Resolve pèse plusieurs méga-octets : la lecture prend un instant,
     autant le dire plutôt que de laisser l'écran figé. */
  showLoad('Lecture de la LUT', file.name || '');
  try {
    const txt = await file.text();
    await nextFrame();
    const p = parseCube(txt);
    hideLoad();
    if (!p){ toast('Ce fichier .cube n’a pas pu être lu.', 3500); return false; }
    LUT.data = p.data; LUT.size = p.size;
    LUT.name = (file.name || 'LUT').replace(/\.cube$/i, '');
    if (GLX) GLX.loaded = null;
    return true;
  } catch(e){ hideLoad(); toast('Impossible d’ouvrir ce fichier.', 3000); return false; }
}

/* ===================== EXPORT =====================
   Avant : on « filmait » le canvas en temps réel. Si le téléphone n'arrivait
   pas à suivre, des images étaient perdues, la cadence réelle ne correspondait
   plus à celle annoncée, et la vidéo saccadait.
   Maintenant : la vidéo est fabriquée image par image. Chaque image de sortie
   correspond à un instant précis de la source, et l'horodatage est écrit
   directement dans le MP4 : cadence fixe, durée exacte, aucun saut. */

const IG_W = 1080, IG_H = 1920, IG_FPS = 30;
const outC = document.createElement('canvas'), outCtx = outC.getContext('2d');
const padC = document.createElement('canvas'), padCtx = padC.getContext('2d');
const recC = document.createElement('canvas'), recCtx = recC.getContext('2d');
let abortExport = false;
const HAS_WEBCODECS = typeof window.VideoEncoder === 'function' && typeof window.VideoFrame === 'function';

/* ---------- Cadence de la source ---------- */
const STD_FPS = [
  {fps:12, num:12, den:1}, {fps:15, num:15, den:1}, {fps:20, num:20, den:1},
  {fps:24000/1001, num:24000, den:1001}, {fps:24, num:24, den:1},
  {fps:25, num:25, den:1}, {fps:30000/1001, num:30000, den:1001},
  {fps:30, num:30, den:1}, {fps:50, num:50, den:1},
  {fps:60000/1001, num:60000, den:1001}, {fps:60, num:60, den:1}
];
function snapFps(f){
  if (!f || !isFinite(f) || f < 8 || f > 130) return {fps:30, num:30, den:1};
  let best = STD_FPS[0];
  STD_FPS.forEach(s => { if (Math.abs(s.fps - f) < Math.abs(best.fps - f)) best = s; });
  return best;
}
/* Instagram accepte 23 à 60 i/s. On garde la cadence de la source si elle tient
   sous 30, sinon on prend exactement une image sur deux : pas de ré-échantillonnage,
   donc pas de micro-saccades. */
function igCadence(c){
  let out = c;
  while (out.fps > 30.5 && out.fps/2 >= 23) out = {fps:out.fps/2, num:out.num, den:out.den*2};
  for (const k of [2, 3, 4, 5]){
    if (out.fps >= 23) break;
    const up = {fps:c.fps*k, num:c.num*k, den:c.den};
    if (up.fps >= 23 && up.fps <= 60.5){ out = up; break; }
  }
  return (out.fps >= 23 && out.fps <= 60.5) ? out : {fps:30, num:30, den:1};
}
function measureFps(v){
  return new Promise(res => {
    if (!v.requestVideoFrameCallback) return res(0);
    let prev = 0, n = 0, sum = 0, done = false;
    const fin = () => { if (!done){ done = true; res(n > 2 && sum > 0 ? n/sum : 0); } };
    const to = setTimeout(fin, 1400);
    const cb = (now, meta) => {
      if (done) return;
      const t = meta && typeof meta.mediaTime === 'number' ? meta.mediaTime : 0;
      if (prev && t > prev && t - prev < .3){ sum += t - prev; n++; }
      prev = t;
      if (n >= 10){ clearTimeout(to); fin(); return; }
      v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
  });
}
async function sourceCadence(){
  let best = 0;
  for (const m of usedVideoMedia()){
    const v = m.el, wasPaused = v.paused;
    try { await v.play(); } catch(e){}
    const f = await measureFps(v);
    if (wasPaused){ try { v.pause(); } catch(e){} }
    if (f > best) best = f;
  }
  return igCadence(snapFps(best));
}

/* ---------- Mise au format de sortie ---------- */
/* Si la composition n'est pas déjà en 9:16, on la centre et on remplit le reste
   avec la composition elle-même, agrandie et floutée. Pas de bandes noires,
   et Instagram n'a plus rien à recadrer. */
function composeOut(OW, OH){
  const sx = OW/S.W, sy = OH/S.H;
  outCtx.setTransform(1, 0, 0, 1, 0, 0);
  outCtx.globalAlpha = 1; outCtx.globalCompositeOperation = 'source-over';
  outCtx.imageSmoothingEnabled = true; outCtx.imageSmoothingQuality = 'high';
  if (Math.abs(sx - sy) < .002){ outCtx.drawImage(cv, 0, 0, OW, OH); return; }
  const pw = 96, ph = Math.max(4, Math.round(pw*OH/OW));
  if (padC.width !== pw || padC.height !== ph){ padC.width = pw; padC.height = ph; }
  const cover = Math.max(pw/S.W, ph/S.H)*1.15;
  padCtx.setTransform(1, 0, 0, 1, 0, 0);
  padCtx.fillStyle = '#15171b'; padCtx.fillRect(0, 0, pw, ph);
  padCtx.imageSmoothingQuality = 'high';
  padCtx.drawImage(cv, pw/2 - S.W*cover/2, ph/2 - S.H*cover/2, S.W*cover, S.H*cover);
  outCtx.drawImage(padC, 0, 0, OW, OH);
  outCtx.fillStyle = 'rgba(14,16,20,.30)'; outCtx.fillRect(0, 0, OW, OH);
  const fit = Math.min(sx, sy);
  const w = Math.round(S.W*fit/2)*2, hh = Math.round(S.H*fit/2)*2;
  outCtx.drawImage(cv, Math.round((OW - w)/2), Math.round((OH - hh)/2), w, hh);
}

/* ---------- Placement des vidéos sur la ligne de temps ---------- */
function seekTo(v, t){
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; clearTimeout(to); v.removeEventListener('seeked', fin); res(); };
    const to = setTimeout(fin, 700);
    v.addEventListener('seeked', fin);
    try { v.currentTime = t; } catch(e){ fin(); }
  });
}
function clipSpan(m, D){
  const v = m.el, st = m.start || 0;
  const tot = isFinite(v.duration) ? v.duration : 0;
  const left = clipLen(m);
  return {st, tot, usable:Math.max(.04, left > 0 ? Math.min(left, D) : D)};
}
async function stageAt(t, D){
  const jobs = [], sp = S.video.speed || 1;
  for (const m of usedVideoMedia()){
    const v = m.el, c = clipSpan(m, D*sp);
    let target = c.st + ((t*sp) % c.usable);
    if (c.tot > 0) target = Math.min(target, Math.max(0, c.tot - .001));
    if (Math.abs(v.currentTime - target) < .0015) continue;
    jobs.push(seekTo(v, target));
  }
  if (jobs.length) await Promise.all(jobs);
}

/* ---------- Écriture du MP4 (cadence fixe) ---------- */
const U32 = v => { const a = new Uint8Array(4); new DataView(a.buffer).setUint32(0, v >>> 0); return a; };
const U16 = v => new Uint8Array([(v >> 8) & 255, v & 255]);
const STR = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
const TBL = arr => { const a = new Uint8Array(arr.length*4), dv = new DataView(a.buffer);
  for (let i = 0; i < arr.length; i++) dv.setUint32(i*4, arr[i] >>> 0); return a; };
function mbox(type, ...parts){
  const list = [];
  const push = p => { if (Array.isArray(p)) p.forEach(push); else if (p) list.push(p); };
  parts.forEach(push);
  let n = 8; list.forEach(a => n += a.length);
  const out = new Uint8Array(n);
  out.set(U32(n), 0); out.set(STR(type), 4);
  let off = 8; list.forEach(a => { out.set(a, off); off += a.length; });
  return out;
}
function fbox(type, version, flags, ...parts){
  return mbox(type, new Uint8Array([version, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255]), parts);
}
const MATRIX = TBL([0x00010000, 0, 0, 0, 0x00010000, 0, 0, 0, 0x40000000]);
const MVTS = 1000;   /* horloge du film : la milliseconde */

/* Descripteur AAC (esds) : c'est lui qui dit au lecteur comment décoder le son. */
function esdsBox(asc, bitrate){
  const dsi = new Uint8Array(2 + asc.length);
  dsi.set([0x05, asc.length]); dsi.set(asc, 2);
  const dcd = new Uint8Array(2 + 13 + dsi.length);
  dcd.set([0x04, 13 + dsi.length, 0x40, 0x15, 0, 0, 0]);
  dcd.set(U32(bitrate), 7); dcd.set(U32(bitrate), 11);
  dcd.set(dsi, 15);
  const sl = new Uint8Array([0x06, 0x01, 0x02]);
  const es = new Uint8Array(2 + 3 + dcd.length + sl.length);
  es.set([0x03, 3 + dcd.length + sl.length, 0, 1, 0]);
  es.set(dcd, 5); es.set(sl, 5 + dcd.length);
  return fbox('esds', 0, 0, es);
}

function buildTrak(t, id){
  const mediaDur = t.delta*t.count;
  const movieDur = Math.round(mediaDur/t.timescale*MVTS);
  const audio = t.kind === 'aud';
  const tkhd = fbox('tkhd', 0, 7, U32(0), U32(0), U32(id), U32(0), U32(movieDur),
    U32(0), U32(0), U16(0), U16(0), U16(audio ? 0x0100 : 0), U16(0), MATRIX,
    U32(audio ? 0 : t.w << 16), U32(audio ? 0 : t.h << 16));
  const mdhd = fbox('mdhd', 0, 0, U32(0), U32(0), U32(t.timescale), U32(mediaDur), U16(0x55C4), U16(0));
  const hdlr = fbox('hdlr', 0, 0, U32(0), STR(audio ? 'soun' : 'vide'), U32(0), U32(0), U32(0),
    STR(audio ? 'SoundHandler' : 'VideoHandler'), new Uint8Array([0]));
  const head = audio ? fbox('smhd', 0, 0, U16(0), U16(0)) : fbox('vmhd', 0, 1, U16(0), U16(0), U16(0), U16(0));
  const dinf = mbox('dinf', fbox('dref', 0, 0, U32(1), fbox('url ', 0, 1)));
  const entry = audio
    ? mbox('mp4a', new Uint8Array([0,0,0,0,0,0]), U16(1),
        U16(0), U16(0), U32(0), U16(t.channels), U16(16), U16(0), U16(0), U32(t.timescale << 16),
        esdsBox(t.desc, t.bitrate || 128000))
    : mbox(t.box, new Uint8Array([0,0,0,0,0,0]), U16(1),
        U16(0), U16(0), U32(0), U32(0), U32(0),
        U16(t.w), U16(t.h), U32(0x00480000), U32(0x00480000), U32(0), U16(1),
        new Uint8Array(32), U16(0x0018), U16(0xFFFF),
        mbox(t.box === 'hvc1' ? 'hvcC' : 'avcC', t.desc));
  const stbl = mbox('stbl',
    fbox('stsd', 0, 0, U32(1), entry),
    fbox('stts', 0, 0, U32(1), U32(t.count), U32(t.delta)),
    audio ? null : fbox('stss', 0, 0, U32(t.syncs.length), TBL(t.syncs)),
    fbox('stsc', 0, 0, U32(1), U32(1), U32(1), U32(1)),
    fbox('stsz', 0, 0, U32(0), U32(t.count), TBL(t.sizes)),
    fbox('stco', 0, 0, U32(t.offsets.length), TBL(t.offsets)));
  return mbox('trak', tkhd, mbox('mdia', mdhd, hdlr, mbox('minf', head, dinf, stbl)));
}

function buildMoov(tracks){
  let dur = 0;
  tracks.forEach(t => dur = Math.max(dur, Math.round(t.delta*t.count/t.timescale*MVTS)));
  const mvhd = fbox('mvhd', 0, 0, U32(0), U32(0), U32(MVTS), U32(dur),
    U32(0x00010000), U16(0x0100), U16(0), U32(0), U32(0), MATRIX, TBL([0,0,0,0,0,0]), U32(tracks.length + 1));
  return mbox('moov', mvhd, tracks.map((t, i) => buildTrak(t, i + 1)));
}

/* tracks[0] = vidéo, tracks[1] = son (facultatif). Les échantillons sont écrits
   piste après piste dans le mdat ; les tables stco donnent les positions. */
function muxMp4(tracks){
  const brand = tracks[0].box === 'hvc1' ? 'hvc1' : 'avc1';
  const ftyp = mbox('ftyp', STR('isom'), U32(0x200), STR('isom'), STR('iso2'), STR(brand), STR('mp41'));
  const place = () => {
    let p = 0;
    tracks.forEach(t => { t.offsets = t.sizes.map(s => { const v = p; p += s; return v; }); });
    return p;
  };
  const total = place();
  let moov = buildMoov(tracks);
  const base = ftyp.length + moov.length + 8;
  tracks.forEach(t => { t.offsets = t.offsets.map(v => v + base); });
  moov = buildMoov(tracks);
  const head = new Uint8Array(8); head.set(U32(total + 8), 0); head.set(STR('mdat'), 4);
  let data = [ftyp, moov, head];
  tracks.forEach(t => { data = data.concat(t.chunks); });
  return new Blob(data, {type:'video/mp4'});
}

/* Les deux encodeurs (image et son) récupèrent leurs morceaux de la même
   façon : on l'écrit une fois. */
function chunkSink(out){
  return (chunk, meta) => {
    if (!out.desc && meta && meta.decoderConfig && meta.decoderConfig.description)
      out.desc = new Uint8Array(meta.decoderConfig.description);
    const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b);
    out.chunks.push(b); out.sizes.push(b.length);
    if (out.syncs && chunk.type === 'key') out.syncs.push(out.chunks.length);
  };
}

/* ---------- Son ----------
   Une seule bande-son part à l'export : celle de la vidéo choisie. On la décode
   en PCM, on la découpe exactement comme l'image (même départ, même boucle),
   puis on la ré-encode en AAC pour la glisser dans le MP4. */
function audioChoices(){ return S.lib.filter(m => m.kind === 'video'); }
let auditionT = 0;
function auditionSound(){
  const m = soundMedia();
  if (!m){ toast('Aucun son sélectionné.', 2000); return; }
  const v = m.el;
  clearTimeout(auditionT);
  try { v.currentTime = m.start || 0; v.muted = false; v.play(); } catch(e){}
  toast('Écoute…', 4000);
  auditionT = setTimeout(() => { try { v.muted = true; } catch(e){} hideToast(); }, 4000);
}
/* Le même sélecteur sert dans l'onglet Style et au moment d'exporter. */
function soundPicker(){
  const list = audioChoices();
  const labels = ['Aucun'].concat(list.map((m, i) => `Vidéo ${i + 1} · ${fmtDur(m.el.duration)}`));
  const idx = () => { const m = soundMedia(); return m ? list.indexOf(m) + 1 : 0; };
  return h('div', {},
    chips(labels, k => labels.indexOf(k) === idx(),
      k => { const i = labels.indexOf(k) - 1; S.audio.id = i < 0 ? null : list[i].id; }),
    h('div', {class:'row'}, btn('Écouter la piste choisie', auditionSound)),
    h('p', {class:'hint'}, list.length > 1
      ? 'Toutes tes vidéos sont listées. Une seule bande-son part dans le fichier : Instagram ne lit que la première piste, en mettre plusieurs ne servirait à rien.'
      : 'Le son de ta vidéo est gardé à l’export. Choisis « Aucun » pour une story muette.'));
}
function soundMedia(){ return audioChoices().find(m => m.id === S.audio.id) || null; }
async function decodePcm(m){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !m.file) return null;
    const ac = new AC();
    const buf = await ac.decodeAudioData(await m.file.arrayBuffer());
    try { ac.close(); } catch(e){}
    return buf && buf.numberOfChannels && buf.length ? buf : null;
  } catch(e){ return null; }
}
let audioIssue = '';
/* Safari ne ré-encode pas toujours l'AAC dans la configuration exacte du fichier
   source. On essaie donc plusieurs profils, puis plusieurs fréquences, quitte à
   rééchantillonner nous-mêmes. */
const AAC_TRY = ['mp4a.40.2', 'mp4a.40.5', 'mp4a.40.29', 'aac'];
async function pickAudioCfg(rate, ch){
  const rates = [rate, 48000, 44100, 32000].filter((v, i, a) => a.indexOf(v) === i);
  const chans = [ch, 1].filter((v, i, a) => a.indexOf(v) === i);
  for (const codec of AAC_TRY)
    for (const sampleRate of rates)
      for (const numberOfChannels of chans){
        const cfg = {codec, sampleRate, numberOfChannels, bitrate:128000};
        try { const ok = await AudioEncoder.isConfigSupported(cfg); if (ok && ok.supported) return cfg; } catch(e){}
      }
  return null;
}
async function buildAudioTrack(D){
  audioIssue = '';
  const m = soundMedia();
  if (!m) return null;
  if (typeof window.AudioEncoder !== 'function' || typeof window.AudioData !== 'function'){
    audioIssue = "Ce navigateur ne sait pas fabriquer de piste audio."; return null;
  }
  const buf = await decodePcm(m);
  if (!buf){ audioIssue = "Le son de ce fichier n’a pas pu être décodé."; return null; }
  const cfg = await pickAudioCfg(buf.sampleRate, Math.min(2, buf.numberOfChannels));
  if (!cfg){ audioIssue = "Aucun encodeur AAC disponible ici."; return null; }

  const rate = cfg.sampleRate, ch = cfg.numberOfChannels;
  const sp = S.video.speed || 1;
  const step = buf.sampleRate/rate*sp;   /* rééchantillonnage, vitesse comprise */
  const src = []; for (let c = 0; c < ch; c++) src.push(buf.getChannelData(Math.min(c, buf.numberOfChannels - 1)));
  const startS = (m.start || 0)*buf.sampleRate;
  const spanS = Math.max(1, clipSpan(m, D*sp).usable*buf.sampleRate);
  const totalS = Math.max(1, Math.round(D*rate));
  const sample = (plane, pos) => {
    const i0 = Math.floor(pos), f = pos - i0;
    const a = i0 < plane.length ? plane[i0] : 0, b = i0 + 1 < plane.length ? plane[i0 + 1] : a;
    return a + (b - a)*f;
  };

  const out = {chunks:[], sizes:[], desc:null};
  const {chunks, sizes} = out;
  let failed = null;
  const enc = new AudioEncoder({output:chunkSink(out), error:e => { failed = e; }});
  try { enc.configure(cfg); } catch(e){ audioIssue = "L’encodeur audio a refusé de démarrer."; return null; }

  const BLK = 4096;
  for (let i = 0; i < totalS && !failed; i += BLK){
    const n = Math.min(BLK, totalS - i);
    const data = new Float32Array(n*ch);
    for (let c = 0; c < ch; c++){
      const plane = src[c], off = c*n;
      for (let k = 0; k < n; k++) data[off + k] = sample(plane, startS + (((i + k)*step) % spanS));
    }
    try {
      const ad = new AudioData({format:'f32-planar', sampleRate:rate, numberOfFrames:n,
        numberOfChannels:ch, timestamp:Math.round(i/rate*1e6), data});
      enc.encode(ad); ad.close();
    } catch(e){ failed = e; break; }
    if (i % (BLK*8) === 0) await new Promise(r => setTimeout(r, 0));
  }
  try { await enc.flush(); enc.close(); } catch(e){ failed = e; }
  const desc = out.desc;
  if (failed){ audioIssue = "L’encodage du son a échoué."; return null; }
  if (!desc || !chunks.length){ audioIssue = "L’encodeur n’a rien produit."; return null; }
  return {kind:'aud', channels:ch, timescale:rate, delta:1024, count:chunks.length,
    chunks, sizes, desc, bitrate:128000};
}

/* ---------- Encodage image par image ---------- */
const AVC_TRY = ['avc1.640028', 'avc1.4d0028', 'avc1.640020', 'avc1.4d0020', 'avc1.42e028'];
async function pickEncoder(W, H, bitrate, fps){
  for (const codec of AVC_TRY){
    const cfg = {codec, width:W, height:H, bitrate, framerate:Math.round(fps),
      latencyMode:'quality', avc:{format:'avc'}};
    try { const s = await VideoEncoder.isConfigSupported(cfg); if (s && s.supported) return {cfg, box:'avc1'}; } catch(e){}
  }
  return null;
}
async function exportPrecise(cad, OW, OH, bitrate){
  const D = clamp(videoDuration(), 1, 60);
  const total = Math.max(1, Math.round(D*cad.fps));
  const pick = await pickEncoder(OW, OH, bitrate, cad.fps);
  if (!pick) return null;
  outC.width = OW; outC.height = OH;
  const out = {chunks:[], sizes:[], syncs:[], desc:null};
  const {chunks, sizes, syncs} = out;
  let failed = null;
  const enc = new VideoEncoder({output:chunkSink(out), error:e => { failed = e; }});
  enc.configure(pick.cfg);

  const bar = h('div', {class:'prog'}, h('i')), label = h('p', {}, 'Préparation…');
  showOverlay(h('div', {class:'ov-box'}, h('b', {}, 'Ta vidéo se prépare'),
    h('p', {}, `${(total/cad.fps).toFixed(1)} secondes au format story.`),
    label, bar, h('p', {}, 'Laisse l’app ouverte, c’est presque fini.')),
    [btn('Arrêter', () => { abortExport = true; }, 'btn danger')]);

  holdVideos = true; exporting = true; offlineExport = true;
  /* Le canvas monte à la résolution demandée : sans ça, un export 4K ne ferait
     qu'agrandir une image calculée en 1080. */
  applyScale(Math.max(1, OW/S.W));
  for (const m of usedVideoMedia()){ try { m.el.pause(); } catch(e){} }
  const usFrame = 1e6*cad.den/cad.num;
  const gop = Math.max(1, Math.round(cad.fps*2));
  const t0 = performance.now();
  let i = 0;
  try {
    for (; i < total; i++){
      if (abortExport || failed) break;
      await stageAt(i/cad.fps, D);
      setGrainFrame(i);
      render();
      composeOut(OW, OH);
      const vf = new VideoFrame(outC, {timestamp:Math.round(i*usFrame), duration:Math.round(usFrame)});
      enc.encode(vf, {keyFrame:i % gop === 0});
      vf.close();
      while (enc.encodeQueueSize > 8 && !failed) await new Promise(r => setTimeout(r, 6));
      const done = i + 1, el = (performance.now() - t0)/1000;
      bar.firstChild.style.width = (done/total*100) + '%';
      const eta = done > 3 ? Math.round(el/done*(total - done)) : 0;
      label.textContent = Math.round(done/total*100) + ' %' + (eta > 1 ? ` · encore ${eta} s` : '');
      if (done % 4 === 0) await new Promise(r => setTimeout(r, 0));
    }
    await enc.flush();
  } catch(e){ failed = e; }
  try { enc.close(); } catch(e){}
  setGrainFrame(null); exporting = false; holdVideos = false; offlineExport = false; layout(); draw();
  const desc = out.desc;
  if (failed || !desc || !chunks.length || i < 2) return null;
  if (!syncs.length) syncs.push(1);
  const mul = cad.num < 1000 ? 1000 : 1;
  const vidTrack = {kind:'vid', w:OW, h:OH, box:pick.box, desc, chunks, sizes, syncs,
    count:chunks.length, timescale:cad.num*mul, delta:cad.den*mul};
  const audTrack = await buildAudioTrack(total/cad.fps);
  return {blob:muxMp4(audTrack ? [vidTrack, audTrack] : [vidTrack]), sound:!!audTrack,
    frames:chunks.length, fps:cad.fps, W:OW, H:OH, codec:pick.cfg.codec};
}

/* ---------- Secours : capture temps réel ---------- */
const MIMES_H264 = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1.4D402A', 'video/mp4;codecs=avc1.42E01E',
  'video/mp4;codecs=h264', 'video/mp4', 'video/webm;codecs=h264'];
const MIMES_FALLBACK = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
function pickMime(list){ return list.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || ''; }
function codecLabel(mime){
  if (/hvc1|hev1/i.test(mime)) return 'HEVC';
  if (/avc1|h264/i.test(mime)) return 'H.264';
  if (/vp9/i.test(mime)) return 'VP9';
  if (/vp8/i.test(mime)) return 'VP8';
  return 'vidéo';
}
/* Récupérer la piste son d'une vidéo : captureStream selon les navigateurs,
   sinon on passe par le graphe audio, qui lui est supporté partout. */
function grabAudioTrack(m){
  const v = m.el;
  const cap = v.captureStream || v.webkitCaptureStream;
  if (cap){
    try { const t = cap.call(v).getAudioTracks()[0]; if (t) return t; } catch(e){}
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!m.tap){
      const ac = new AC();
      const dest = ac.createMediaStreamDestination();
      ac.createMediaElementSource(v).connect(dest);
      m.tap = {ac, dest};
    }
    try { m.tap.ac.resume(); } catch(e){}
    return m.tap.dest.stream.getAudioTracks()[0] || null;
  } catch(e){ return null; }
}
async function exportRealtime(OW, OH, bitrate, cad){
  if (!window.MediaRecorder || !recC.captureStream){
    closeOverlay(); toast("L'export vidéo n'est pas pris en charge ici. Essaie dans Safari ou Chrome.", 6000); return;
  }
  const fps = Math.min(30, Math.max(24, Math.round(cad.fps)));
  const D = clamp(videoDuration(), 1, 60);
  const bar = h('div', {class:'prog'}, h('i')), label = h('p', {}, 'Préparation…');
  showOverlay(h('div', {class:'ov-box'}, h('b', {}, 'Ta vidéo se prépare'), label, bar), []);
  holdVideos = true;
  const vids = usedVideos();
  for (const m of usedVideoMedia()){ try { m.el.pause(); } catch(e){} await seekTo(m.el, m.start || 0); }
  outC.width = OW; outC.height = OH;
  recC.width = OW; recC.height = OH; recCtx.imageSmoothingQuality = 'high';
  const mime = pickMime([...MIMES_H264, ...MIMES_FALLBACK]);
  const stream = recC.captureStream(0), track = stream.getVideoTracks()[0];
  const paced = track && typeof track.requestFrame === 'function';
  if (!paced) stream.getTracks().forEach(t => t.stop());
  const st2 = paced ? stream : recC.captureStream(fps);
  /* Capture temps réel : on branche la piste son de la vidéo choisie.
     Elle est démutée le temps de l'enregistrement, tu vas donc l'entendre. */
  const sm = soundMedia();
  let aTrack = null;
  if (sm){
    try { sm.el.muted = false; } catch(e){}
    aTrack = grabAudioTrack(sm);
    if (aTrack) st2.addTrack(aTrack);
  }
  let rec;
  try { rec = new MediaRecorder(st2, mime ? {mimeType:mime, videoBitsPerSecond:bitrate} : {videoBitsPerSecond:bitrate}); }
  catch(e){ try { rec = new MediaRecorder(st2); } catch(e2){ holdVideos = false; closeOverlay(); toast("Impossible de démarrer l'enregistrement.", 5000); return; } }
  const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  exporting = true; recording = true; applyScale(Math.max(1, OW/S.W));
  vids.forEach(v => v.play().catch(() => {}));
  holdVideos = false;
  setGrainFrame(0); render(); composeOut(OW, OH); recCtx.drawImage(outC, 0, 0);
  rec.start(250);
  const t0 = performance.now(), total = Math.round(D*fps);
  let drawn = 0, dropped = 0;
  await new Promise(resolve => {
    const step = () => {
      const want = Math.min(total, Math.floor((performance.now() - t0)/1000*fps) + 1);
      if (want > drawn){
        if (want - drawn > 1) dropped += want - drawn - 1;
        drawn = want;
        setGrainFrame(drawn); render(); composeOut(OW, OH); recCtx.drawImage(outC, 0, 0);
        if (paced) track.requestFrame();
      }
      bar.firstChild.style.width = Math.min(100, drawn/total*100) + '%';
      label.textContent = `${(drawn/fps).toFixed(1)} / ${D.toFixed(1)} s`;
      if (drawn >= total) resolve(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  await new Promise(r => setTimeout(r, 120));
  rec.stop(); await stopped;
  if (aTrack){ try { aTrack.stop(); } catch(e){} }
  if (sm){ try { sm.el.muted = true; } catch(e){} }
  st2.getTracks().forEach(t => t.stop());
  setGrainFrame(null); exporting = false; recording = false; layout(); draw();
  const type = (rec.mimeType || mime || 'video/mp4').split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(chunks, {type});
  showResult(blob, ext, OW, OH, fps, codecLabel(rec.mimeType || mime || ''),
    dropped > total*.1 ? 'L’image a un peu sauté. Refais-la en « Meilleure qualité » pour un rendu net.' : null,
    !!aTrack);
}

function showResult(blob, ext, W, H, fps, codec, warn, sound, extra){

/* ================= Mémoire =================
   Chaque montage est un brouillon : il se sauvegarde tout seul dans IndexedDB,
   avec sa vignette. Tu quittes l'app en plein travail, tu la rouvres, tu es
   exactement là où tu t'étais arrêté. Et tu peux en mener plusieurs de front. */
const DB_NAME = 'montage-studio', DB_V = 1;
let dbPromise = null, saveT = 0, restoring = false, docId = null, thumbAt = 0, lastThumb = null;
function db(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('pas de base'));
    const r = indexedDB.open(DB_NAME, DB_V);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', {keyPath:'uid'});
      if (!d.objectStoreNames.contains('state')) d.createObjectStore('state');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }).catch(e => { dbPromise = null; throw e; });
  return dbPromise;
}
/* Tout dans la même transaction : la rouvrir plus tard la ferait expirer. */
function idb(store, mode, fn){
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode), s = t.objectStore(store);
    let out;
    const r = fn(s);
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = t.onabort = () => rej(t.error);
  }));
}
const putMedia = rec => idb('media', 'readwrite', s => s.put(rec));
const getMedia = uid => idb('media', 'readonly', s => s.get(uid));
const allMediaKeys = () => idb('media', 'readonly', s => s.getAllKeys());
const putDoc = doc => idb('state', 'readwrite', s => s.put(doc, 'doc:' + doc.id));
const getDoc = id => idb('state', 'readonly', s => s.get('doc:' + id));
const delDoc = id => idb('state', 'readwrite', s => s.delete('doc:' + id));
const allDocs = () => idb('state', 'readonly', s => s.getAll()).then(v => (v || []).filter(d => d && d.id));
const setCurrent = id => idb('state', 'readwrite', s => s.put(id, 'current'));
const getCurrent = () => idb('state', 'readonly', s => s.get('current'));

function newUid(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

async function rememberMedia(m, file){
  if (!m.uid) m.uid = newUid();
  try { await putMedia({uid:m.uid, name:file.name || 'media', type:file.type || '', kind:m.kind, blob:file}); }
  catch(e){}
}

/* La vignette coûte un rendu complet : au plus une toutes les 12 secondes. */
function draftThumb(){
  const now = Date.now();
  if (lastThumb && now - thumbAt < 12000) return lastThumb;
  try {
    const prev = exporting; exporting = true; render(); exporting = prev;
    lastThumb = coverFromCanvas(); thumbAt = now; draw();
  } catch(e){}
  return lastThumb;
}
function docRecord(withThumb){
  if (!docId) docId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  return {
    id:docId, at:Date.now(),
    name:(TPL[S.tpl] && TPL[S.tpl].name) || 'Montage',
    thumb:withThumb ? draftThumb() : lastThumb,
    snap:snapshot(), tpl:S.tpl, tab:S.tab,
    video:Object.assign({}, S.video), cal:Object.assign({}, S.cal),
    audio:(S.lib.find(m => m.id === S.audio.id) || {}).uid || null,
    lib:S.lib.filter(m => m.uid).map(m => ({uid:m.uid, id:m.id, start:m.start || 0, end:m.end || 0}))
  };
}
function flushSave(withThumb){
  if (restoring || !S.lib.length) return Promise.resolve();
  clearTimeout(saveT);
  const doc = docRecord(withThumb);
  return putDoc(doc).then(() => setCurrent(doc.id)).catch(() => {});
}
function saveSoon(){
  /* Sans média rien à retenir, et au lancement on ne veut surtout pas écraser
     la sauvegarde avec le montage vide avant de l'avoir relue. */
  if (restoring || !S.lib.length) return;
  clearTimeout(saveT);
  saveT = setTimeout(() => flushSave(true), 900);
}

async function hydrate(doc){
  S.lib = [];
  let maxId = 0;
  for (const e of doc.lib){
    let rec = null;
    try { rec = await getMedia(e.uid); } catch(err){}
    if (!rec || !rec.blob) continue;
    const file = rec.blob instanceof File ? rec.blob
      : new File([rec.blob], rec.name || 'media', {type:rec.type || ''});
    const m = rec.kind === 'video' ? await loadVideo(file) : await loadImage(file);
    if (!m) continue;
    m.id = e.id; m.uid = e.uid; m.start = e.start || 0; m.end = e.end || 0; m.thumb = makeThumb(m);
    if (m.kind === 'video'){
      m.file = file;
      m.el.addEventListener('timeupdate', () => { m.thumb = makeThumb(m); }, {once:true});
    }
    maxId = Math.max(maxId, m.id);
    S.lib.push(m);
  }
  if (!S.lib.length) return false;
  mid = Math.max(mid, maxId);
  docId = doc.id;
  S.tpl = doc.tpl || 0;
  Object.assign(S.video, doc.video || {});
  Object.assign(S.cal, doc.cal || {});
  const am = S.lib.find(m => m.uid === doc.audio);
  S.audio.id = am ? am.id : null;
  restore(doc.snap);
  S.tab = doc.tab || 'media';
  lastThumb = doc.thumb || null; thumbAt = 0;
  HIST.past = [snapshot()]; HIST.future = [];
  return true;
}

async function openDraft(id){

async function restoreSession(){

  if (!ok) return false;

  return true;
}

/* Un média n'est supprimé que si plus aucun brouillon ne s'en sert. */
async function gcMedia(){
  try {
    const docs = await allDocs();
    const keep = new Set();
    docs.forEach(d => (d.lib || []).forEach(e => keep.add(e.uid)));
    S.lib.forEach(m => { if (m.uid) keep.add(m.uid); });
    const keys = await allMediaKeys();
    for (const k of (keys || [])) if (!keep.has(k)) await idb('media', 'readwrite', s => s.delete(k));
  } catch(e){}
}
async function removeDraft(id){
  await delDoc(id).catch(() => {});
  if (docId === id) docId = null;
  const cur = await getCurrent().catch(() => null);
  if (cur === id) await setCurrent(null).catch(() => {});
  await gcMedia();
  buildDrafts();
}

/* L'étagère de brouillons, en haut de l'écran d'accueil. */
async function buildDrafts(){
  const host = $('drafts');
  if (!host) return;
  let docs = [];
  try { docs = await allDocs(); } catch(e){}
  docs = docs.filter(d => d.lib && d.lib.length).sort((a, b) => b.at - a.at);
  host.innerHTML = '';
  if (!docs.length){ host.hidden = true; return; }
  host.hidden = false;
  host.appendChild(h('h2', {}, 'Tes brouillons'));
  const grid = h('div', {class:'cards'});
  docs.forEach(d => {
    const art = d.thumb
      ? h('img', {src:d.thumb, alt:''})
      : h('div', {class:'draft-blank'});
    const when = new Date(d.at);
    const card = h('button', {class:'card', onclick:() => openDraft(d.id)}, art,
      h('b', {}, d.name),
      h('span', {}, when.toLocaleDateString('fr-FR', {day:'numeric', month:'short'}) + ' · ' +
        when.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})));
    const kill = h('button', {class:'draft-x', 'aria-label':'Supprimer ce brouillon',
      onclick:e => {
        e.stopPropagation();
        dialog('Supprimer ce brouillon ?', d.name + ' — cette action est définitive.',
          btn('Supprimer', () => { closeOverlay(); removeDraft(d.id); }, 'btn danger big'));
      }}, '×');
    grid.appendChild(h('div', {class:'draft'}, card, kill));
  });
  host.appendChild(grid);
}

/* ================= Démarrage ================= */
/* App en arrière-plan : on coupe les vidéos et la boucle de rendu. */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    S.lib.forEach(m => { if (m.kind === 'video' && !m.el.paused){ try { m.el.pause(); } catch(e){} } });
    flushSave(false);
  } else draw();
});
window.addEventListener('resize', layout);
setFormat('3:4', false);
S.cal.to = daysInMonth();
applyTemplate(0);
buildHome();
buildSheet();
layout(); draw(); mark();
document.getElementById('boot').hidden = true;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
/* Service worker : l'app démarre sans réseau une fois ouverte une première fois.
   Ignoré si la page est ouverte en file:// (Fichiers, AirDrop…). */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0)
  navigator.serviceWorker.register('sw.js').catch(() => {});
restoreSession().then(ok => { if (!ok) buildDrafts(); }).catch(() => {});
})();
</script>
</body>
